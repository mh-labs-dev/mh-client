name: Bug report / 问题反馈
description: Report a reproducible MH issue / 提交可复现的 MH 问题
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Remove credentials and private device data from logs and screenshots. 请移除日志与截图中的凭据和设备隐私。For security issues, request a private contact without posting vulnerability details."
  - type: input
    id: version
    attributes:
      label: MH version / 版本
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system / 操作系统
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and observed behavior / 复现步骤与实际表现
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期表现
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs or screenshots / 已移除敏感信息的日志或截图
